<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SP-1 déterminisme</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 1rem; }
  code, textarea { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  textarea { width: 100%; height: 12rem; }
</style>
</head>
<body>
<h1>SP-1 — géométrie canonique</h1>
<p id="status">Exécution…</p>
<p>Moteur : <code id="engine"></code><br>Configurations : <code id="count"></code><br>
Empreinte matrice : <code id="matrix"></code><br>Empreinte globale : <code id="global"></code></p>
<p>Navigateur : <code id="ua"></code><br>Contexte sécurisé : <code id="secure"></code></p>
<textarea id="out" readonly></textarea>
<script type="module">
  import { runMatrix, toHex } from "./core.mjs";
  import { MATRIX } from "./matrix.mjs";

  const $ = (id) => document.getElementById(id);
  const env = new URLSearchParams(location.search).get("env") ?? "manual";
  $("ua").textContent = navigator.userAgent;
  $("secure").textContent = String(window.isSecureContext);
  try {
    if (!crypto.subtle) throw new Error("crypto.subtle indisponible (contexte non sécurisé : HTTPS requis)");
    const sha = async (bytes) => toHex(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)));
    const r = await runMatrix(MATRIX, sha);
    const output = {
      environment: { runtime: env, userAgent: navigator.userAgent, hash: "WebCrypto crypto.subtle.digest", secureContext: window.isSecureContext },
      ...r,
    };
    $("engine").textContent = r.engine;
    $("count").textContent = r.count;
    $("matrix").textContent = r.matrixSha256;
    $("global").textContent = r.globalSha256;
    $("out").value = JSON.stringify(output, null, 2);
    $("status").textContent = "Terminé.";
    if (env !== "manual") await fetch("/result?env=" + encodeURIComponent(env), { method: "POST", body: JSON.stringify(output) });
  } catch (e) {
    $("status").textContent = "ERREUR : " + e.message;
    if (env !== "manual") await fetch("/result?env=" + encodeURIComponent(env), { method: "POST", body: JSON.stringify({ error: e.message }) });
  }
</script>
</body>
</html>
