name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: TypeScript strict
        run: npm run typecheck
      - name: Lint des termes interdits et frontières de la couche métier
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
